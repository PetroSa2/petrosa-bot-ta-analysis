name: CI Checks

on:
  workflow_dispatch:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  pipeline:
    name: CI Pipeline
    uses: PetroSa2/petrosa-shared-workflows/.github/workflows/ci-pipeline.yml@ac55a0ad451d63a6973d6228deebb5651814ca98  # yamllint disable-line rule:line-length
    with:
      service-name: 'bot-ta-analysis'
      image-name: 'yurisa2/petrosa-bot-ta-analysis'
      python-version: '3.11'
      skip-docker-build: true
      # Explicit per-repo floor (petrosa_k8s#1052 epic step 5 / #274). Measured
      # coverage is 81% (quality-baseline-2026-09.md §1), far above the
      # shared-workflow default of 40 — per the socket-client precedent
      # (petrosa-socket-client#136 / PR #140) and siblings extractor#286,
      # tradeengine#575, data-manager#290, realtime-strategies#212, pin the
      # canonical Golden Standard floor of 40 explicitly instead of a
      # narrower ratchet that would need repeated manual bumps as coverage
      # naturally grows.
      coverage-threshold: '40'
    secrets: inherit
